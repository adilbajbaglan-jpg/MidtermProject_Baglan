<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>BagaShop - Contact</title><link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"><link rel="stylesheet" href="css/style.css"></head><body><header><nav class="navbar navbar-expand-md navbar-dark"><div class="container"><a class="navbar-brand logo" href="index.html">BagaShop</a><button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#menu"><span class="navbar-toggler-icon"></span></button><div class="collapse navbar-collapse" id="menu"><div class="navbar-nav ms-auto"><a class="nav-link" href="index.html">Home</a><a class="nav-link" href="products.html">Products</a><a class="nav-link" href="about.html">About</a><a class="nav-link active" href="contact.html">Contact</a></div></div></div></nav></header><main class="section"><h1>Contact BagaShop</h1><p>Fill in the form if you have a question about a product.</p><form class="contact-form"><fieldset><legend>Customer message</legend><label for="name">Name</label><input type="text" id="name" name="name" required maxlength="40" placeholder="Your name"><label for="email">Email</label><input type="email" id="email" name="email" required placeholder="name@example.com"><label for="age">Age</label><input type="number" id="age" name="age" min="16" max="100"><label for="date">Preferred contact date</label><input type="date" id="date" name="date"><label for="color">Favorite color</label><input type="color" id="color" name="color"><p>Order type</p><div class="radio-row"><input type="radio" id="personal" name="order" value="personal" checked><label for="personal">Personal</label><input type="radio" id="gift" name="order" value="gift"><label for="gift">Gift</label></div><div class="check-row"><input type="checkbox" id="news" name="news"><label for="news">Send store news</label></div><label for="message">Message</label><textarea id="message" name="message" rows="5" placeholder="Write your question"></textarea><button class="btn-shop mt-3" type="submit">Send</button></fieldset></form></main><footer>© 2026 BagaShop</footer><script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script></body></html>
